[package]
name = "petlink-desktop"
version = "0.1.0"
description = "PetLink connected desktop pet"
authors = ["PetLink contributors"]
edition = "2021"

[lib]
name = "petlink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
